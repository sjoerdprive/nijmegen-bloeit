# Projectstatussen. De sleutel (bijv. "lopend") gebruik je in een projectbestand
# bij "status:". Het symbool (vol, half, kwart of leeg) is een extra visuele hint;
# de tekst is leidend. Pas teksten altijd in beide talen aan.
lopend:
  symbool: vol
  nl: { label: Lopend, uitleg: De activiteit is daadwerkelijk gestart. }
  en: { label: Ongoing, uitleg: The activity has actually started. }
in-voorbereiding:
  symbool: half
  nl: { label: In voorbereiding, uitleg: Er worden concrete stappen gezet. }
  en: { label: In preparation, uitleg: Concrete steps are being taken. }
belangstelling:
  symbool: kwart
  nl: { label: Belangstelling inventariseren, uitleg: Deelname of draagvlak moet nog worden onderzocht. }
  en: { label: Gauging interest, uitleg: Participation or support still needs to be explored. }
idee:
  symbool: leeg
  nl: { label: Idee, uitleg: Een mogelijke toekomstige activiteit. }
  en: { label: Idea, uitleg: A possible future activity. }
